requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "feedparser>=6.0", "beautifulsoup4>=4.12", "trafilatura>=1.12", "PyYAML>=6.0", "python-dateutil>=2.9"]
[project.optional-dependencies]
test = ["pytest>=8.0"]
[tool.pytest.ini_options]
pythonpath = ["src"]
